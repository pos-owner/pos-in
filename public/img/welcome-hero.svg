<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t">
  <title id="t">An apartment building beside a phone showing rent paid by UPI</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#a66cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff8466" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3fb0"/>
      <stop offset="1" stop-color="#2c2468"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="1" stop-color="#f0806a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f1ff"/>
    </linearGradient>
    <linearGradient id="pay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b2c8f"/>
      <stop offset="1" stop-color="#7a4cd9"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd67d"/>
      <stop offset="1" stop-color="#ff9259"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffc861"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1b1446" flood-opacity="0.28"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b1446" flood-opacity="0.2"/>
    </filter>
    <clipPath id="scr"><rect x="378" y="98" width="164" height="300" rx="22"/></clipPath>
  </defs>

  <!-- backdrop -->
  <path fill="url(#sky)" d="M86 120C120 52 214 26 318 34c118 9 228 44 262 132 30 78-8 176-96 220-96 48-262 52-354 6C34 352 20 250 86 120z"/>
  <circle cx="132" cy="92" r="26" fill="#ffc861" opacity="0.85"/>
  <circle cx="132" cy="92" r="40" fill="#ffc861" opacity="0.18"/>

  <!-- ground -->
  <ellipse cx="320" cy="402" rx="268" ry="16" fill="#2c2468" opacity="0.12"/>

  <!-- back building -->
  <g>
    <rect x="252" y="150" width="118" height="252" rx="10" fill="url(#bldg2)"/>
    <g fill="#ffffff" opacity="0.55">
      <rect x="270" y="172" width="22" height="26" rx="4"/><rect x="304" y="172" width="22" height="26" rx="4"/><rect x="338" y="172" width="18" height="26" rx="4"/>
      <rect x="270" y="214" width="22" height="26" rx="4"/><rect x="304" y="214" width="22" height="26" rx="4"/><rect x="338" y="214" width="18" height="26" rx="4"/>
      <rect x="270" y="256" width="22" height="26" rx="4"/><rect x="304" y="256" width="22" height="26" rx="4"/><rect x="338" y="256" width="18" height="26" rx="4"/>
      <rect x="270" y="298" width="22" height="26" rx="4"/><rect x="304" y="298" width="22" height="26" rx="4"/><rect x="338" y="298" width="18" height="26" rx="4"/>
    </g>
  </g>

  <!-- main building: an Indian low-rise with balconies and a rooftop water tank -->
  <g filter="url(#softer)">
    <!-- rooftop tank -->
    <rect x="196" y="74" width="40" height="34" rx="8" fill="#1f1a3d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="192" y="70" width="48" height="10" rx="5" fill="#2a2452"/>
    <rect x="206" y="108" width="4" height="12" fill="#1f1a3d"/><rect x="222" y="108" width="4" height="12" fill="#1f1a3d"/>
    <!-- parapet + body -->
    <rect x="96" y="114" width="176" height="290" rx="12" fill="url(#bldg)"/>
    <rect x="90" y="112" width="188" height="14" rx="7" fill="#6e52c9"/>
    <!-- floors -->
    <g>
      <g id="floor">
        <rect x="114" y="140" width="40" height="40" rx="6" fill="url(#window)"/>
        <rect x="114" y="140" width="40" height="40" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
        <path d="M134 140v40M114 160h40" stroke="#c98a2a" stroke-opacity="0.35" stroke-width="2"/>
        <rect x="170" y="140" width="40" height="40" rx="6" fill="#8f7ae0" opacity="0.55"/>
        <rect x="226" y="140" width="30" height="40" rx="6" fill="url(#window)"/>
        <!-- balcony -->
        <rect x="106" y="182" width="156" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
        <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="2">
          <path d="M112 182v-12M124 182v-12M136 182v-12M148 182v-12M160 182v-12"/>
        </g>
        <!-- plant pot -->
        <rect x="236" y="172" width="14" height="10" rx="3" fill="#ff8466"/>
        <circle cx="240" cy="166" r="7" fill="#34c759"/><circle cx="248" cy="164" r="6" fill="#2fb350"/>
      </g>
      <use href="#floor" y="64"/>
      <use href="#floor" y="128"/>
    </g>
    <!-- ground floor door + shop shutter -->
    <rect x="166" y="340" width="40" height="64" rx="6" fill="#1f1a3d"/>
    <circle cx="198" cy="374" r="3" fill="#ffc861"/>
    <rect x="114" y="350" width="40" height="54" rx="4" fill="#7a63d6" opacity="0.6"/>
    <path d="M114 362h40M114 374h40M114 386h40" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="218" y="350" width="38" height="30" rx="4" fill="url(#window)" opacity="0.9"/>
  </g>

  <!-- trees -->
  <g>
    <rect x="62" y="352" width="6" height="50" rx="3" fill="#6b4a2e"/>
    <circle cx="65" cy="338" r="26" fill="#34c759"/>
    <circle cx="52" cy="350" r="16" fill="#2fb350"/>
    <circle cx="80" cy="348" r="14" fill="#2fb350"/>
    <rect x="578" y="364" width="5" height="38" rx="2.5" fill="#6b4a2e"/>
    <circle cx="580" cy="352" r="20" fill="#34c759"/>
    <circle cx="592" cy="362" r="12" fill="#2fb350"/>
  </g>

  <!-- receipt card -->
  <g transform="rotate(-8 300 330)" filter="url(#softer)">
    <rect x="236" y="286" width="128" height="96" rx="14" fill="#ffffff"/>
    <rect x="252" y="304" width="58" height="8" rx="4" fill="#d9d3f0"/>
    <rect x="252" y="320" width="84" height="6" rx="3" fill="#ece8f8"/>
    <rect x="252" y="332" width="70" height="6" rx="3" fill="#ece8f8"/>
    <rect x="252" y="352" width="46" height="12" rx="6" fill="#4b2c8f"/>
    <circle cx="336" cy="356" r="14" fill="none" stroke="#34c759" stroke-width="3"/>
    <path d="M329 356l5 5 9-10" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- phone -->
  <g filter="url(#soft)">
    <rect x="368" y="86" width="184" height="324" rx="32" fill="#16122e" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="378" y="98" width="164" height="300" rx="22" fill="url(#screen)"/>
    <g clip-path="url(#scr)">
      <!-- header wash -->
      <path d="M378 98h164v96c-50 18-114 18-164 0z" fill="#4b2c8f" opacity="0.08"/>
      <rect x="434" y="104" width="52" height="12" rx="6" fill="#16122e"/>
      <!-- paid check -->
      <circle cx="460" cy="160" r="26" fill="#34c759"/>
      <circle cx="460" cy="160" r="36" fill="#34c759" opacity="0.15"/>
      <path d="M447 160l9 9 18-19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- amount + labels -->
      <rect x="418" y="206" width="84" height="16" rx="8" fill="#1f1a3d"/>
      <rect x="430" y="230" width="60" height="8" rx="4" fill="#c9c2e6"/>
      <!-- month chips -->
      <rect x="394" y="252" width="40" height="18" rx="9" fill="#34c759" opacity="0.18"/>
      <rect x="440" y="252" width="40" height="18" rx="9" fill="#34c759" opacity="0.18"/>
      <rect x="486" y="252" width="40" height="18" rx="9" fill="#af52de" opacity="0.18"/>
      <rect x="402" y="259" width="24" height="4" rx="2" fill="#1f8a3b"/>
      <rect x="448" y="259" width="24" height="4" rx="2" fill="#1f8a3b"/>
      <rect x="494" y="259" width="24" height="4" rx="2" fill="#8944ab"/>
      <!-- list rows -->
      <rect x="394" y="284" width="132" height="44" rx="12" fill="#ffffff" stroke="#ece8f8"/>
      <circle cx="414" cy="306" r="10" fill="#ff9500" opacity="0.9"/>
      <rect x="432" y="298" width="50" height="6" rx="3" fill="#c9c2e6"/>
      <rect x="432" y="310" width="34" height="5" rx="2.5" fill="#e3def3"/>
      <rect x="494" y="300" width="22" height="8" rx="4" fill="#1f1a3d" opacity="0.7"/>
      <!-- pay button -->
      <rect x="394" y="342" width="132" height="38" rx="19" fill="url(#pay)"/>
      <rect x="430" y="358" width="60" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- rupee coin -->
  <g filter="url(#softer)">
    <circle cx="560" cy="96" r="30" fill="url(#coin)" stroke="#ffffff" stroke-width="5"/>
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M549 84h22M549 93h22M551 84h5c7 0 11 4 11 9s-4 9-11 9h-5l17 16"/>
    </g>
  </g>

  <!-- UPI notification bubble -->
  <g filter="url(#softer)">
    <rect x="290" y="104" width="120" height="44" rx="14" fill="#ffffff"/>
    <rect x="302" y="116" width="20" height="20" rx="6" fill="#4b2c8f"/>
    <path d="M308 126l3 3 6-6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" y="118" width="64" height="6" rx="3" fill="#c9c2e6"/>
    <rect x="330" y="130" width="44" height="5" rx="2.5" fill="#e3def3"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffc861">
    <path d="M300 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M604 156l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#a66cff"/>
    <path d="M44 220l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ff8466"/>
  </g>
</svg>
